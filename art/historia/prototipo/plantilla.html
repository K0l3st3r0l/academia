  <div class="background" aria-hidden="true"><div class="background-image" id="background-image"></div></div>

    <div class="brand">Academ<span>IA</span></div>
    <div class="chapter-label" id="chapter-label"></div>
    <button class="hud-goal" id="goals-button" aria-label="Ver los objetivos del capítulo"><span class="goal-symbol" aria-hidden="true">⌖</span><span id="current-goal">Tu viaje está por comenzar</span></button>
    <span class="hud-stat" aria-label="Fichas de tiempo"><span aria-hidden="true">✦</span> <span id="tokens">0</span></span>
    <button id="items-button" aria-label="Ver tus objetos">◇ <span id="item-count">0</span></button>

  </header>

  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

<script>
// STORY_ENGINE_START
const STORY_LEVELS = ['inicial', 'intermedio', 'avanzado'];
const STORY_SUBJECTS = ['matematica', 'lenguaje', 'ciencias', 'historia', 'ingles'];
const storyClone = value => JSON.parse(JSON.stringify(value));
class StoryEngine {
  constructor(chapter, settings = {}) {
    if (!chapter || !Array.isArray(chapter.scenes) || !chapter.scenes.length) throw new Error('El capítulo no tiene escenas.');
    this.chapter = chapter;
    const level = STORY_LEVELS.includes(settings.startingLevel) ? settings.startingLevel : 'intermedio';
    this.state = {version:1, chapterId:chapter.id, startingLevel:level, phase:'chapter', sceneIndex:-1,
      flags:{}, tokens:0, items:[], currentGoal:'', goals:[], levels:Object.fromEntries(STORY_SUBJECTS.map(s => [s, level])),
      streaks:Object.fromEntries(STORY_SUBJECTS.map(s => [s, 0])), results:{}, choices:{}, reflection:null, piece:null,
      stack:[], pending:null, checkpoint:null};
  }
  condition(cond) {
    if (!cond) return true;
    const flags = this.state.flags;
    if (Object.hasOwn(cond, 'eq')) return Object.hasOwn(flags, cond.flag) && flags[cond.flag] === cond.eq;
    if (Object.hasOwn(cond, 'ne')) return flags[cond.flag] !== cond.ne;
    if (Object.hasOwn(cond, 'set')) return Object.hasOwn(flags, cond.flag) === Boolean(cond.set);
    return false;
  }
  levelFor(subject) { return this.state.levels[subject] || this.state.startingLevel; }
  variantFor(beat) {
    const level = this.levelFor(beat.subject);
    const variant = beat.variants[level] || beat.variants.intermedio || beat.variants.inicial || beat.variants.avanzado;
    if (!variant) throw new Error(`El desafío ${beat.id} no tiene variantes.`);
    return {level, variant};
  }
  scene() { return this.chapter.scenes[this.state.sceneIndex] || null; }
  view() {

  function renderOrder(workspace,view,submit) {

  function renderGrid(workspace,view,submit) {
