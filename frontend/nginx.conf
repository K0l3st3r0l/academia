server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Behind the proxy, a redirect to /academia/ must not carry this container's port.
    absolute_redirect off;

    # The Academy lobby is one large static page (art/academia/lobby/build.py) and its opening
    # film; they change without a new file name, so browsers revalidate (ETag, 304 when unchanged).
    # ^~ keeps the image rule below from caching these as immutable.
    location ^~ /academia/ {
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Without an explicit Cache-Control, browsers cache index.html heuristically
    # (10% of its age) and keep requesting hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
